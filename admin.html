<!doctype html><html lang="ar" dir="rtl"><head><title>لوحة الإدارة — بوابة البرلمان الطلابي</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0e5a58"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap"><link rel="stylesheet" href="css/style.css"></head><body>
<a class="skip" href="#main">تخطي إلى المحتوى</a>
<header class="top"><div class="wrap bar"><a class="brand" href="index.html"><span class="logo" aria-hidden="true">ب</span>بوابة البرلمان الطلابي</a>
<nav aria-label="القائمة الرئيسية"><a href="index.html">الرئيسية</a><a id="nav-requests" href="requests.html" hidden>طلباتي</a><a id="nav-admin" href="admin.html" hidden>لوحة الإدارة</a><a id="nav-login" href="login.html">دخول / حساب جديد</a><a id="nav-logout" href="#" hidden>تسجيل الخروج</a></nav></div></header>
<main id="admin-main" class="wrap" hidden>
<h1>لوحة الإدارة</h1>
<div id="msg" class="msg" role="alert" hidden></div>
<section><h2>الطلبات الجديدة</h2><div class="stats" id="counts"></div><p><a class="btn btn-small" href="admin-requests.html">فتح كل الطلبات</a></p></section>
<section class="panel"><h2>رموز الدعوة</h2>
<form id="form-invite" class="row" novalidate>
<div><label for="i-label">اسم الرمز (للتمييز فقط)</label><input id="i-label" maxlength="80" placeholder="مثال: الصف العاشر"></div>
<div><label for="i-max">عدد مرات الاستخدام (عدد صحيح)</label><input id="i-max" type="number" min="1" max="500" step="1" inputmode="numeric" value="30"></div>
<div><label for="i-exp">تاريخ الانتهاء <span class="opt">(اختياري)</span></label><input id="i-exp" type="date"></div>
<button class="btn" type="submit">إنشاء رمز</button><div id="msg-invite" class="msg" role="alert" hidden></div></form>
<div class="scroll"><table><thead><tr><th>الاسم</th><th>الرمز</th><th>الاستخدام</th><th>الانتهاء</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="invites-body"></tbody></table></div></section>
<section class="panel"><h2>حسابات الطالبات (<span id="count-accounts">0</span>)</h2>
<div class="scroll"><table><thead><tr><th>الاسم</th><th>الصف</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="accounts-body"></tbody></table></div></section>
<section class="panel"><h2>آخر العمليات الإدارية</h2>
<div class="scroll"><table><thead><tr><th>الوقت</th><th>العملية</th><th>الهدف</th></tr></thead><tbody id="audit-body"></tbody></table></div></section>
</main>
<script type="module" src="js/admin.js"></script></body></html>
